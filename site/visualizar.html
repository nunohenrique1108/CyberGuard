<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>CyberGuard | Relatório Técnico de Auditoria</title>
    <style>
        :root { 
            --primary: #2c3e50; 
            --accent: #3498db; 
            --text: #34495e;
            --border: #ecf0f1;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 40px; 
            color: var(--text);
        }
        
        /* Botões de Ação */
        .actions { 
            max-width: 850px; 
            margin: 0 auto 20px auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .btn { 
            padding: 10px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            border: none; 
            font-weight: bold; 
            text-decoration: none; 
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .btn-back { background: var(--primary); color: white; }
        .btn-print { background: var(--accent); color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-1px); }

        /* Estética do Documento Profissional */
        .documento {
            background: white;
            max-width: 850px;
            margin: 0 auto;
            padding: 80px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            min-height: 1000px;
            position: relative;
            border-top: 12px solid var(--primary);
        }

        /* Cabeçalho do Relatório (Estilo Modalfa) */
        .doc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }
        .logo-area { font-size: 24px; font-weight: bold; color: var(--primary); }
        .confidencial-tag { 
            background: #fdf2f2; 
            color: #e74c3c; 
            padding: 5px 12px; 
            border-radius: 4px; 
            font-size: 10px; 
            font-weight: bold; 
            text-transform: uppercase;
        }

        /* Conteúdo formatado da IA */
        #conteudo {
            white-space: pre-wrap; 
            line-height: 1.8;
            font-size: 15px;
            text-align: justify;
        }

        /* Classes injetadas via JS para destacar o texto da IA */
        .ia-seccao {
            color: var(--accent);
            font-weight: bold;
            display: block;
            margin-top: 25px;
            margin-bottom: 10px;
            font-size: 16px;
            border-left: 4px solid var(--accent);
            padding-left: 15px;
            text-transform: uppercase;
        }

        .ia-destaque {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            font-style: italic;
            border: 1px solid var(--border);
            display: block;
            margin: 15px 0;
        }

        /* Estilo de Impressão */
        @media print {
            body { background: white; padding: 0; }
            .actions { display: none; }
            .documento { 
                box-shadow: none; 
                padding: 40px; 
                margin: 0; 
                width: 100%; 
                border-top: 5px solid var(--primary); 
            }
        }
    </style>
</head>
<body>

    <div class="actions">
        <a href="controlos.html" class="btn btn-back">← Voltar à Auditoria</a>
        <div>
            <span style="font-size: 12px; color: #7f8c8d; margin-right: 15px;">Documento gerado por CyberGuard AI</span>
            <button onclick="window.print()" class="btn btn-print">🖨️ Exportar PDF Oficial</button>
        </div>
    </div>

    <div class="documento">
        <div class="doc-header">
            <div class="logo-area">🛡️ CyberGuard <span style="font-weight: normal; color: #bdc3c7;">GRC</span></div>
            <div class="confidencial-tag">CONFIDENCIAL - USO INTERNO</div>
        </div>

        <div id="conteudo">
            A processar relatório técnico detalhado...
        </div>

        <div style="margin-top: 50px; border-top: 1px solid #eee; padding-top: 20px; font-size: 12px; color: #bdc3c7;">
            Certificado de Auditoria ISO 27001:2022 | ID: <span id="doc-id"></span> | Responsável: Nuno Carvalho 
        </div>
    </div>

    <script>
        async function carregarFicheiro() {
            const params = new URLSearchParams(window.location.search);
            const fileUrl = params.get('file');
            document.getElementById('doc-id').innerText = 'AUD-' + Math.floor(Date.now() / 1000);

            if (!fileUrl) {
                document.getElementById('conteudo').innerHTML = "<div class='ia-destaque' style='color:red'>Erro: Ficheiro não localizado.</div>";
                return;
            }

            try {
                const response = await fetch(fileUrl);
                let texto = await response.text();
                
                // Lógica de Formatação para parecer profissional (estilo Modalfa)
                // 1. Destacar as secções obrigatórias que pedimos no server.js
                const seccoes = [
                    "SUMÁRIO EXECUTIVO", 
                    "ANÁLISE DE RISCO", 
                    "FALHA DETETADA", 
                    "PLANO DE ACÇÃO CORRETIVA",
                    "CONCLUSÃO",
                    "DIRETRIZES DE IMPLEMENTAÇÃO"
                ];

                seccoes.forEach(s => {
                    const regex = new RegExp(s, "g");
                    texto = texto.replace(regex, `<span class="ia-seccao">${s}</span>`);
                });

                // 2. Destacar pontos importantes em blocos cinzentos
                texto = texto.replace(/Vulnerabilidade:/g, `<span class="ia-destaque">Vulnerabilidade:`);
                texto = texto.replace(/Recomendação:/g, `<span class="ia-destaque">Recomendação:`);

                document.getElementById('conteudo').innerHTML = texto;

            } catch (err) {
                document.getElementById('conteudo').innerHTML = "<div class='ia-destaque' style='color:red'>Erro ao carregar o conteúdo da evidência. Verifique a ligação ao servidor.</div>";
            }
        }

        window.onload = carregarFicheiro;
    </script>
</body>
</html>
