<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>A Gerar Relatório CyberGuard...</title>
    <script src="config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 15%;
        }
        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>A gerar Relatório de Auditoria...</h2>
    <p>O download do PDF começará automaticamente. Por favor aguarde.</p>

    <script>
        // Função inteligente para gerar ações reais caso a IA falhe
        function sugerirAcaoCorretiva(nomeControlo) {
            if (!nomeControlo) return "Realizar auditoria técnica e aplicar medidas mitigatórias.";
            const n = nomeControlo.toLowerCase();
            
            if(n.includes('política') || n.includes('diretriz')) return "Redigir, aprovar formalmente pela gestão e publicar a política correspondente.";
            if(n.includes('acesso') || n.includes('autentica') || n.includes('palavra-passe')) return "Rever matriz de acessos, implementar princípio do menor privilégio (PoLP) e forçar MFA.";
            if(n.includes('rede') || n.includes('comunica')) return "Avaliar segmentação de rede, atualizar firewalls e realizar testes de intrusão (PenTest).";
            if(n.includes('incidente') || n.includes('evento')) return "Atualizar o plano de resposta a incidentes e realizar testes de simulação com a equipa.";
            if(n.includes('físic') || n.includes('instalaç') || n.includes('equipamento')) return "Reforçar controlo de perímetros físicos, registo de visitantes e proteção ambiental.";
            if(n.includes('ativo') || n.includes('inventári')) return "Atualizar o inventário de ativos (hardware/software) e rever os proprietários atribuídos.";
            if(n.includes('fornecedor') || n.includes('terceir')) return "Exigir SLAs de segurança nos contratos e solicitar relatórios de auditoria aos fornecedores críticos.";
            if(n.includes('cópia') || n.includes('backup') || n.includes('segurança')) return "Implementar rotina automática de backups imutáveis e testar a restauração regularmente.";
            if(n.includes('consciencializa') || n.includes('formação')) return "Agendar ações de formação obrigatórias sobre phishing e segurança da informação para todos os colaboradores.";
            if(n.includes('vulnerabilidade') || n.includes('patch')) return "Estabelecer rotina de gestão de patches e correções de software críticos em menos de 15 dias.";
            
            return "Rever a documentação do controlo, identificar lacunas e implementar processos de melhoria contínua.";
        }

        async function gerarRelatorioCyberGuard() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            
            try {
                // 1. DADOS DA TUA BASE DE DADOS (AIVEN)
                const resControles = await fetch(API_URL + '/api/controlos');
                const todosControlos = await resControles.json();
                
                // 2. DADOS DA IA
                let dadosIA = { score: 0, resumo: "", plano: [] };
                try {
                    const resIA = await fetch(API_URL + '/api/relatorio-ia');
                    dadosIA = await resIA.json();
                } catch (err) {
                    console.log("IA indisponível, a usar sistema de fallback automático inteligente.");
                }

                // 3. CÁLCULOS SEGUROS
                const total = todosControlos.length > 0 ? todosControlos.length : 1; 
                const conformes = todosControlos.filter(c => c.estado === 'CONFORME').length;
                const controlosPendentes = todosControlos.filter(c => c.estado !== 'CONFORME');
                const pendentesCount = controlosPendentes.length;
                const scoreReal = Math.round((conformes / total) * 100);
                const dataHoje = new Date().toLocaleDateString('pt-PT');

                // ==========================================
                // PÁGINA 1: CAPA
                // ==========================================
                doc.setFillColor(44, 62, 80);
                doc.rect(0, 0, 210, 45, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(24);
                doc.setFont("helvetica", "bold");
                doc.text("CyberGuard GRC", 105, 20, { align: 'center' });
                doc.setFontSize(14);
                doc.setFont("helvetica", "normal");
                doc.text("Relatório Oficial de Conformidade ISO 27001", 105, 30, { align: 'center' });
                doc.setFontSize(10);
                doc.text(`Data de Emissão: ${dataHoje}`, 105, 38, { align: 'center' });

                // Barra de Progresso
                doc.setTextColor(44, 62, 80);
                doc.setFontSize(16);
                doc.setFont("helvetica", "bold");
                doc.text("Score Global de Conformidade", 15, 60);

                doc.setFillColor(236, 240, 241);
                doc.rect(15, 65, 180, 8, 'F');
                if (scoreReal >= 70) doc.setFillColor(39, 174, 96);
                else doc.setFillColor(230, 126, 34);
                const larguraBarra = (scoreReal / 100) * 180;
                doc.rect(15, 65, larguraBarra, 8, 'F');

                doc.setFontSize(12);
                doc.setTextColor(0, 0, 0);
                doc.text(`${scoreReal}% Alcançado`, 195, 63, { align: 'right' });

                // Estatísticas
                doc.setFontSize(11);
                doc.setFont("helvetica", "normal");
                doc.text(`Total de Controlos: ${todosControlos.length}`, 15, 85);
                doc.setTextColor(39, 174, 96);
                doc.text(`Conformes: ${conformes}`, 15, 92);
                doc.setTextColor(231, 76, 60);
                doc.text(`Pendentes / Não Conformes: ${pendentesCount}`, 15, 99);

                doc.setDrawColor(189, 195, 199);
                doc.line(15, 105, 195, 105);

                // Parecer Técnico (Fallback incluído)
                doc.setTextColor(44, 62, 80);
                doc.setFontSize(14);
                doc.setFont("helvetica", "bold");
                doc.text("Parecer do Auditor Chefe:", 15, 118);
                
                doc.setTextColor(50, 50, 50);
                doc.setFontSize(10);
                doc.setFont("helvetica", "normal");
                
                let textoResumo = dadosIA.resumo;
                if (!textoResumo || textoResumo.includes("Dados insuficientes")) {
                    textoResumo = `Após análise técnica aos ${todosControlos.length} controlos da norma ISO 27001, regista-se uma conformidade de ${scoreReal}%. Existem atualmente ${pendentesCount} controlos que requerem atenção imediata (estado não conforme ou pendente). O plano de ação abaixo detalha os próximos passos recomendados para mitigar os riscos associados à infraestrutura e garantir o alinhamento normativo.`;
                }
                
                const resumoLongo = doc.splitTextToSize(textoResumo, 180);
                doc.text(resumoLongo, 15, 126);

                // ==========================================
                // PÁGINA 2: PLANO DE AÇÃO
                // ==========================================
                doc.addPage();
                doc.setTextColor(44, 62, 80);
                doc.setFontSize(18);
                doc.setFont("helvetica", "bold");
                doc.text("Plano de Ação Corretiva (PAC)", 15, 20);
                doc.setFontSize(10);
                doc.setFont("helvetica", "normal");
                doc.text("Ações prioritárias para os controlos vulneráveis.", 15, 26);

                let pacBody = [];
                // Se a IA gerou um plano válido, usamos.
                if (dadosIA.plano && dadosIA.plano.length > 0) {
                    pacBody = dadosIA.plano.map(p => [p.controlo || '-', p.problema || '-', p.solucao || '-']);
                } 
                // Se a IA não gerou e temos controlos pendentes, usamos a nossa função inteligente!
                else if (controlosPendentes.length > 0) {
                    pacBody = controlosPendentes.map(c => [
                        c.id_controlo, 
                        c.nome_controlo, 
                        sugerirAcaoCorretiva(c.nome_controlo)
                    ]);
                } 
                // Se estiver tudo a 100% (nenhum pendente)
                else {
                    pacBody = [['-', 'Nenhuma falha detetada.', 'Sistema em total conformidade.']];
                }

                doc.autoTable({
                    startY: 32,
                    head: [['ID Controlo', 'Descrição / Problema', 'Ação Corretiva Recomendada']],
                    body: pacBody,
                    theme: 'striped',
                    headStyles: { fillColor: [231, 76, 60] }, // Vermelho Alerta
                    styles: { fontSize: 9, cellPadding: 4 },
                    columnStyles: { 0: { cellWidth: 25 }, 1: { cellWidth: 60 } }
                });

                // ==========================================
                // PÁGINA 3: TABELA GERAL DE CONTROLOS
                // ==========================================
                doc.addPage();
                doc.setTextColor(44, 62, 80);
                doc.setFontSize(18);
                doc.setFont("helvetica", "bold");
                doc.text("Anexo A: Todos os Controlos ISO 27001", 15, 20);

                const tabelaControlos = todosControlos.map(c => [
                    c.id_controlo, 
                    c.nome_controlo, 
                    c.risco || '-', 
                    c.estado || 'PENDENTE'
                ]);

                if (tabelaControlos.length > 0) {
                    doc.autoTable({
                        startY: 28,
                        head: [['Controlo', 'Descrição', 'Risco', 'Estado']],
                        body: tabelaControlos,
                        theme: 'grid',
                        headStyles: { fillColor: [44, 62, 80] },
                        styles: { fontSize: 8 },
                        didParseCell: function(data) {
                            if (data.section === 'body' && data.column.index === 3) {
                                if (data.cell.text[0] === 'CONFORME') {
                                    data.cell.styles.textColor = [39, 174, 96]; // Verde
                                    data.cell.styles.fontStyle = 'bold';
                                } else {
                                    data.cell.styles.textColor = [231, 76, 60]; // Vermelho
                                    data.cell.styles.fontStyle = 'bold';
                                }
                            }
                        }
                    });
                }

                // ==========================================
                // RODAPÉ
                // ==========================================
                const pageCount = doc.internal.getNumberOfPages();
                for (let i = 1; i <= pageCount; i++) {
                    doc.setPage(i);
                    doc.setFontSize(8);
                    doc.setTextColor(150, 150, 150);
                    doc.text(`CyberGuard GRC | Relatório Confidencial | Página ${i} de ${pageCount}`, 105, 290, { align: 'center' });
                }

                // Salva o PDF
                doc.save(`Auditoria_ISO27001_CyberGuard_${new Date().getTime()}.pdf`);

                // Retorna à página anterior após gerar
                setTimeout(() => { window.history.back(); }, 2000);

            } catch (erro) {
                console.error("Erro fatal:", erro);
                alert("Erro ao ligar à base de dados. Certifique-se que o servidor está a correr.");
                window.history.back();
            }
        }

        // Executa a função automaticamente
        window.onload = gerarRelatorioCyberGuard;
    </script>
</body>
</html>
