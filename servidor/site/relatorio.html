<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<script>
async function gerarRelatorioCompletoModalfa() {
    // Alerta para o utilizador saber que o processo começou
    alert("A preparar o relatório profissional... Por favor aguarde.");

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    
    try {
        // 1. OBTER DADOS COMPLETOS DA BASE DE DADOS
        const resControles = await fetch(API_URL + '/api/controlos');
        const todosControlos = await resControles.json();
        
        // 2. TENTAR OBTER DADOS DA IA
        let dadosIA = { score: 0, resumo: "", plano: [] };
        try {
            const resIA = await fetch(API_URL + '/api/relatorio-ia');
            dadosIA = await resIA.json();
        } catch (err) {
            console.warn("Aviso: A IA demorou muito a responder. A usar Plano B (geração automática).");
        }

        // 3. CÁLCULOS MATEMÁTICOS SEGUROS (Independentes da IA)
        const total = todosControlos.length || 1; 
        const conformes = todosControlos.filter(c => c.estado === 'CONFORME').length;
        const controlosPendentes = todosControlos.filter(c => c.estado !== 'CONFORME');
        const pendentesCount = controlosPendentes.length;
        const scoreReal = Math.round((conformes / total) * 100);
        
        const dataHoje = new Date().toLocaleDateString('pt-PT');

        // ==========================================
        // PÁGINA 1: CAPA E RESUMO EXECUTIVO
        // ==========================================
        
        // Cabeçalho Principal
        doc.setFillColor(44, 62, 80);
        doc.rect(0, 0, 210, 45, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(24);
        doc.setFont("helvetica", "bold");
        doc.text("CyberGuard GRC", 105, 20, { align: 'center' });
        doc.setFontSize(14);
        doc.setFont("helvetica", "normal");
        doc.text("Relatório Executivo de Conformidade ISO 27001", 105, 30, { align: 'center' });
        doc.setFontSize(10);
        doc.text(`Data de Emissão: ${dataHoje}`, 105, 38, { align: 'center' });

        // Barra de Progresso Segura
        doc.setTextColor(44, 62, 80);
        doc.setFontSize(16);
        doc.setFont("helvetica", "bold");
        doc.text("Score Global de Conformidade", 15, 60);

        doc.setFillColor(236, 240, 241);
        doc.rect(15, 65, 180, 8, 'F');
        if (scoreReal >= 70) doc.setFillColor(39, 174, 96); // Verde
        else doc.setFillColor(230, 126, 34); // Laranja
        const larguraBarra = (scoreReal / 100) * 180;
        doc.rect(15, 65, larguraBarra, 8, 'F');

        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        doc.text(`${scoreReal}% Alcançado`, 195, 63, { align: 'right' });

        // Estatísticas
        doc.setFontSize(11);
        doc.setFont("helvetica", "normal");
        doc.text(`Total de Controlos Avaliados: ${total}`, 15, 85);
        doc.setTextColor(39, 174, 96);
        doc.text(`Controlos Conformes: ${conformes}`, 15, 92);
        doc.setTextColor(231, 76, 60);
        doc.text(`Controlos Pendentes / Vulneráveis: ${pendentesCount}`, 15, 99);

        doc.setDrawColor(189, 195, 199);
        doc.line(15, 105, 195, 105);

        // Parecer Técnico (Inteligente)
        doc.setTextColor(44, 62, 80);
        doc.setFontSize(14);
        doc.setFont("helvetica", "bold");
        doc.text("Parecer Técnico:", 15, 118);
        
        doc.setTextColor(50, 50, 50);
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        
        // Se a IA não der texto, o nosso sistema constrói um texto automático real!
        let textoResumo = dadosIA.resumo;
        if (!textoResumo || textoResumo.includes("Dados insuficientes")) {
            textoResumo = `Após análise técnica aos ${total} controlos estipulados pela norma ISO 27001, verifica-se uma taxa de conformidade de ${scoreReal}%. O sistema detetou ${pendentesCount} controlos em estado não conforme ou pendente. É recomendada a revisão e mitigação imediata destes pontos para garantir a segurança da infraestrutura.`;
        }
        
        const resumoLongo = doc.splitTextToSize(textoResumo, 180);
        doc.text(resumoLongo, 15, 126);

        // ==========================================
        // PÁGINA 2: PLANO DE AÇÃO (GARANTIDO QUE NUNCA FICA EM BRANCO)
        // ==========================================
        doc.addPage();
        doc.setTextColor(44, 62, 80);
        doc.setFontSize(18);
        doc.setFont("helvetica", "bold");
        doc.text("Plano de Ação Corretiva (PAC)", 15, 20);
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text("Ações recomendadas para os controlos que necessitam de mitigação.", 15, 26);

        let pacBody = [];
        
        // Lógica à prova de falhas: Se a IA falhar a tabela, criamos a tabela com a Base de Dados!
        if (dadosIA.plano && dadosIA.plano.length > 0) {
            pacBody = dadosIA.plano.map(p => [p.controlo || '-', p.problema || '-', p.solucao || '-']);
        } else if (controlosPendentes.length > 0) {
            pacBody = controlosPendentes.map(c => [
                c.id_controlo, 
                c.nome_controlo, 
                `Rever documentação e aplicar mitigação. Risco: ${c.risco || 'Indefinido'}`
            ]);
        } else {
            pacBody = [['-', 'Nenhum controlo pendente.', 'A organização está 100% conforme com a norma.']];
        }

        // Desenhar a Tabela 2
        doc.autoTable({
            startY: 32,
            head: [['ID ISO', 'Descrição do Controlo / Problema', 'Ação Recomendada']],
            body: pacBody,
            theme: 'striped',
            headStyles: { fillColor: [231, 76, 60] }, // Vermelho para destacar que é um Plano de Ação
            styles: { fontSize: 9, cellPadding: 4 },
            columnStyles: { 0: { cellWidth: 25 } }
        });

        // ==========================================
        // PÁGINA 3 EM DIANTE: TODOS OS CONTROLOS
        // ==========================================
        doc.addPage();
        doc.setTextColor(44, 62, 80);
        doc.setFontSize(18);
        doc.setFont("helvetica", "bold");
        doc.text("Anexo A: Estado Detalhado dos Controlos", 15, 20);

        const tabelaControlos = todosControlos.map(c => [
            c.id_controlo, 
            c.nome_controlo, 
            c.risco || 'N/A', 
            c.estado || 'PENDENTE'
        ]);

        if (tabelaControlos.length > 0) {
            doc.autoTable({
                startY: 28,
                head: [['Controlo', 'Descrição', 'Nível de Risco', 'Estado Atual']],
                body: tabelaControlos,
                theme: 'grid',
                headStyles: { fillColor: [44, 62, 80] },
                styles: { fontSize: 8 },
                columnStyles: {
                    0: { cellWidth: 25, fontStyle: 'bold' },
                    1: { cellWidth: 'auto' },
                    2: { cellWidth: 25 },
                    3: { cellWidth: 30, fontStyle: 'bold' }
                },
                didParseCell: function(data) {
                    if (data.section === 'body' && data.column.index === 3) {
                        if (data.cell.text[0] === 'CONFORME') {
                            data.cell.styles.textColor = [39, 174, 96]; // Verde
                        } else {
                            data.cell.styles.textColor = [231, 76, 60]; // Vermelho
                        }
                    }
                }
            });
        }

        // ==========================================
        // RODAPÉ EM TODAS AS PÁGINAS
        // ==========================================
        const pageCount = doc.internal.getNumberOfPages();
        for (let i = 1; i <= pageCount; i++) {
            doc.setPage(i);
            doc.setFontSize(8);
            doc.setTextColor(150, 150, 150);
            doc.text(`Relatório Gerado Automaticamente por CyberGuard GRC | Página ${i} de ${pageCount}`, 105, 290, { align: 'center' });
        }

        // SALVAR FICHEIRO
        doc.save(`Relatorio_ISO27001_CyberGuard_${new Date().getTime()}.pdf`);

    } catch (erro) {
        console.error("Erro fatal ao gerar PDF:", erro);
        alert("Ocorreu um erro no navegador ao desenhar o PDF. Verifique a consola (F12).");
    }
}
</script>
