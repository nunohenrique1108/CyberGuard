<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>CyberGuard | Centro de Remediação de Riscos</title>
    
    <style>
        :root { --primary: #2c3e50; --secondary: #34495e; --accent: #3498db; --success: #27ae60; --warning: #f39c12; --danger: #e74c3c; --light: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--light); display: flex; min-height: 100vh; }
        
        .sidebar { width: 260px; background: var(--secondary); color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; }
        .sidebar-header { padding: 25px; font-size: 22px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        
        .sidebar-item { padding: 15px 25px; cursor: pointer; transition: 0.3s; text-decoration: none; color: white; display: block; border-left: 4px solid transparent; }
        .sidebar-item:hover { background: rgba(255,255,255,0.1); border-left-color: var(--accent); }
        .active { background: rgba(255,255,255,0.2); border-left-color: var(--accent); }
        
        .logout-item { margin-top: auto; background: #3d465a; color: #e74c3c; border-left: 4px solid #e74c3c; padding: 15px 25px; text-decoration: none; display: block; font-weight: bold; transition: 0.3s; }
        
        .main-content { flex: 1; margin-left: 260px; padding: 40px; }

        .page-header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .page-header h2 { color: var(--primary); margin: 0; font-size: 26px; }

        .tabs-container { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; font-size: 16px; font-weight: bold; color: #95a5a6; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--accent); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .ticket-list { display: flex; flex-direction: column; gap: 15px; }
        .ticket-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #ccc; }
        .ticket-card.critico { border-left-color: var(--danger); }
        .ticket-card.medio { border-left-color: var(--warning); }
        .ticket-card.aguarda { border-left-color: #f1c40f; background: #fffdf3; }
        .ticket-card.sucesso { border-left-color: var(--success); }
        
        .ticket-id { font-weight: bold; color: var(--primary); font-size: 15px; }
        .empresa-tag { background: #ebf5fb; color: var(--accent); padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .risco-badge { font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; border: 1px solid; }
        
        .btn-acao { background: var(--danger); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-acao:hover { opacity: 0.9; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; margin-top: 10px; padding: 10px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; font-family: inherit; }
        .btn-ia { background: #8e44ad; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">🛡️ CyberGuard</div>
        <a href="dashboard.html" class="sidebar-item">📊 Dashboard</a>
        <a href="controlos.html" class="sidebar-item">📋 Auditoria Anexo A</a>
        <a href="riscos.html" class="sidebar-item active">🔥 Riscos Críticos</a>
        <a href="evidencias.html" class="sidebar-item">📁 Evidências</a>
        <a href="historico.html" class="sidebar-item">🕒 Histórico</a>
        <a href="perfil.html" class="sidebar-item">👤 Perfil</a>
        <a href="index.html" class="logout-item">🚪 Sair</a>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h2>🔥 Centro de Remediação de Riscos</h2>
            <button onclick="window.location.href='controlos.html'" style="background:white; border:1px solid #cbd5e1; padding:8px 15px; cursor:pointer; border-radius:6px; font-weight:bold; color:var(--secondary);">⬅ Alterar Auditoria</button>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="mudarTab('pendentes', this)">🚨 Requer Ação</button>
            <button class="tab-btn" onclick="mudarTab('mitigados', this)">✅ Riscos Mitigados</button>
        </div>

        <div id="tab-pendentes" class="tab-content active">
            <div class="ticket-list" id="lista-pendentes"></div>
        </div>

        <div id="tab-mitigados" class="tab-content">
            <div class="ticket-list" id="lista-mitigados"></div>
        </div>
    </main>

    <div id="modal-tratamento" class="modal">
        <div class="modal-content">
            <span style="float:right; cursor:pointer; font-size:24px; font-weight:bold; color:#7f8c8d;" onclick="fecharModal()">&times;</span>
            <h2>🛠️ Definir Plano de Ação: <span id="modal-id"></span></h2>
            <p style="font-size:13px; color:#7f8c8d; margin:0;">O risco passará ao estado intermédio até que a evidência de conformidade seja submetida.</p>
            <textarea id="texto-plano" placeholder="Escreva as contramedidas técnicas organizacionais necessárias..."></textarea>
            <button class="btn-ia" onclick="sugerirMitigacaoIA()">✨ Sugestão Gemini IA</button>
            <div id="caixa-ia" style="display:none; background:#f4f6f7; padding:12px; margin-top:10px; border-left:4px solid #8e44ad; font-size:13px; color:#2c3e50; border-radius:4px;"></div>
            <button onclick="salvarPlanoAcao()" style="width:100%; background:var(--primary); color:white; border:none; padding:12px; margin-top:20px; cursor:pointer; font-weight:bold; border-radius:6px;">Salvar Plano e Aguardar Evidência</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('usuario')) || { nome: "Nuno Carvalho" };
        let riscoAtual = null;

        function mudarTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
        }

        async function carregarRiscos() {
            const empresaAtiva = localStorage.getItem('empresaAtiva') || 'CyberGuard GRC';
            document.querySelector('.page-header h2').innerText = `🔥 Remediação: ${empresaAtiva}`;

            const res = await fetch(API_URL + '/api/controlos');
            const controlos = await res.json();
            
            const riscos = controlos.filter(c => c.empresa === empresaAtiva || empresaAtiva === 'CyberGuard GRC');
            
            const listaP = document.getElementById('lista-pendentes');
            const listaM = document.getElementById('lista-mitigados');
            listaP.innerHTML = ''; listaM.innerHTML = '';

            riscos.forEach(r => {
                if (r.estado === 'CONFORME') {
                    listaM.innerHTML += `
                        <div class="ticket-card sucesso">
                            <div>
                                <span class="empresa-tag" style="background:#e8f8f5; color:var(--success);">${r.empresa || 'Empresa'}</span>
                                <div class="ticket-id" style="margin-top:5px;">${r.id_controlo} - ${r.nome_controlo}</div>
                            </div>
                            <div style="color:var(--success); font-weight:bold; font-size:13px;">✓ TOTALMENTE MITIGADO</div>
                        </div>`;
                } else if (r.estado === 'PLANO APLICADO') {
                    // ESTADO NOVO: Aguarda submissão da evidência técnica
                    listaP.innerHTML += `
                        <div class="ticket-card aguarda">
                            <div>
                                <span class="risco-badge" style="color: #d4ac0d; border-color: #d4ac0d; background:white;">⏳ AGUARDA EVIDÊNCIA</span>
                                <div class="ticket-id" style="margin-top:5px;">${r.id_controlo} - ${r.nome_controlo}</div>
                                <div style="font-size:12px; color:#7f8c8d; margin-top:5px; font-style:italic;">${r.plano_acao || ''}</div>
                            </div>
                            <div>
                                <input type="file" id="file-risco-${r.id_controlo}" style="display:none;" onchange="subirEvidenciaRisco('${r.id_controlo}')">
                                <button class="btn-acao" style="background:#f1c40f; color:#2c3e50;" onclick="document.getElementById('file-risco-${r.id_controlo}').click()">📎 Anexar Evidência</button>
                            </div>
                        </div>`;
                } else {
                    listaP.innerHTML += `
                        <div class="ticket-card ${r.risco === 'CRÍTICO' ? 'critico' : 'medio'}">
                            <div>
                                <span class="empresa-tag">${r.empresa || 'Empresa'}</span>
                                <div class="ticket-id" style="margin-top:5px;">${r.id_controlo} - ${r.nome_controlo}</div>
                            </div>
                            <button class="btn-acao" onclick="abrirModal('${r.id_controlo}', '${r.nome_controlo}')">Tratar Risco</button>
                        </div>`;
                }
            });
        }

        function abrirModal(id, nome) {
            riscoAtual = id;
            document.getElementById('modal-id').innerText = id;
            document.getElementById('texto-plano').value = '';
            document.getElementById('caixa-ia').style.display = 'none';
            document.getElementById('modal-tratamento').style.display = 'flex';
        }

        function fecharModal() { document.getElementById('modal-tratamento').style.display = 'none'; }

        function sugerirMitigacaoIA() {
            document.getElementById('caixa-ia').style.display = 'block';
            const s = "Gemini sugere: Implementar arquitetura de Firewall segmentada, ativar MFA global em todas as consolas administrativas e aplicar criptografia de dados em repouso (AES-256).";
            document.getElementById('caixa-ia').innerText = s;
            document.getElementById('texto-plano').value = s;
        }

        async function salvarPlanoAcao() {
            const plano = document.getElementById('texto-plano').value;
            if(!plano.trim()) return alert("Escreva o plano de ação!");
            
            await fetch(API_URL + '/api/mitigar-risco', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id_controlo: riscoAtual, plano_acao: plano, auditor: user.nome })
            });
            fecharModal();
            carregarRiscos();
        }

        async function subirEvidenciaRisco(id) {
            const fileInput = document.getElementById(`file-risco-${id}`);
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('ficheiro', fileInput.files[0]);
            formData.append('id_controlo', id);

            try {
                const resUpload = await fetch(API_URL + '/api/evidencias/upload', {
                    method: 'POST',
                    body: formData
                });
                const dataUpload = await resUpload.json();

                if (dataUpload.success) {
                    await fetch(API_URL + '/api/update-status', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ id: id, novo_estado: 'CONFORME', auditor: user.nome })
                    });
                    alert("✅ Evidência validada e enviada! O controlo passou a CONFORME.");
                    carregarRiscos();
                } else { alert("Falha no upload."); }
            } catch (err) { alert("Erro de comunicação."); }
        }

        window.onload = carregarRiscos;
    </script>
</body>
</html>
